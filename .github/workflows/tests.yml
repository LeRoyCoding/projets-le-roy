name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.1'
            mysql: 'mysql:8.0'
          - php: '8.3'
            mysql: 'mysql:8.0'
          - php: '8.2'
            mysql: 'mariadb:10.11'
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized || mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LR_DB_HOST: 127.0.0.1
      LR_DB_USER: root
      LR_DB_PASS: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, zlib, ctype
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe PHP et shell
        run: |
          for f in www/*.php www/api/*.php outils/*.php; do php -l "$f"; done
          bash -n serveur-interne/recuperer-sauvegardes.sh serveur-interne/alerter.sh deploiement/deployer.sh deploiement/retour-arriere.sh
      - name: Tests (sécurité, droits, corbeille, sauvegardes, déploiement…)
        run: npm test
